name: Build LiveNotifierCam iOS IPA

on:
  workflow_dispatch:
  push:
    paths:
      - 'iOSApp/**'
      - 'LiveStartup/iOSApp/**'
      - '.github/workflows/build-ios-ipa.yml'

jobs:
  build-ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project and build unsigned IPA
        run: |
          if [ -d "LiveStartup/iOSApp" ]; then
            cd LiveStartup/iOSApp
          elif [ -d "iOSApp" ]; then
            cd iOSApp
          fi
          xcodegen generate
          xcodebuild \
            -project LiveNotifierCam.xcodeproj \
            -scheme LiveNotifierCam \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LiveNotifierCam.app Payload/
          zip -r -y LiveNotifierCam.ipa Payload

      - name: Upload LiveNotifierCam.ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveNotifierCam-iOS-IPA
          path: '**/LiveNotifierCam.ipa'
          retention-days: 30
